name: Build Magic Phone Direct Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/magic-phone-0.5.5-byok

permissions:
  contents: read

jobs:
  android-direct-debug:
    name: Verify and build direct-only Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact Magic Phone source and pinned upstream
        uses: actions/checkout@v4
        with:
          repository: avayearam/magics-phone
          ref: 0c0ee54c32af1f5191cf51a82c8eb5f4460f103a
          path: magic-phone
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm source SHA and submodules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C magic-phone rev-parse HEAD)" = "0c0ee54c32af1f5191cf51a82c8eb5f4460f103a"
          git -C magic-phone submodule status
          test -f magic-phone/android/voice-sip-agent/gradlew
          test -f magic-phone/android/voice-sip-agent/sip-pjsua2/native/build-pjsua2.sh


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: magic-phone-gradle-${{ runner.os }}-${{ hashFiles('magic-phone/android/voice-sip-agent/**/*.gradle*', 'magic-phone/android/voice-sip-agent/**/gradle-wrapper.properties') }}
          restore-keys: |
            magic-phone-gradle-${{ runner.os }}-

      - name: Install Android SDK 37.2 and pinned NDK using preinstalled runner tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.2" "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig autoconf automake libtool pkg-config build-essential bison flex perl curl unzip zip

      - name: Verify direct-only endpoint and device token contract
        shell: bash
        run: |
          set -euo pipefail
          bash magic-phone/android/voice-sip-agent-overlay/tests/direct-only-contract.sh

      - name: Apply verified Magic Phone overlay and Vazirmatn fonts
        shell: bash
        run: |
          set -euo pipefail
          bash magic-phone/android/voice-sip-agent-overlay/apply.sh
          grep -Fq 'wss://voice.magics.site/ws?mode=phone' magic-phone/android/voice-sip-agent/app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/GeminiLiveEndpoint.kt

      - name: Restore verified native JNI cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: magic-phone/android/voice-sip-agent/sip-pjsua2/src/generated
          key: magic-phone-native-5105a1f-2.17-openssl3.5.9-opus1.6.1-ndk28.2-arm64-v1

      - name: Build pinned native SIP dependency if cache unavailable
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd magic-phone/android/voice-sip-agent/sip-pjsua2/native
          bash ./build-pjsua2.sh

      - name: Cache verified native JNI for subsequent builds
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: magic-phone/android/voice-sip-agent/sip-pjsua2/src/generated
          key: magic-phone-native-5105a1f-2.17-openssl3.5.9-opus1.6.1-ndk28.2-arm64-v1

      - name: Verify native JNI and Java files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s magic-phone/android/voice-sip-agent/sip-pjsua2/src/generated/jniLibs/arm64-v8a/libpjsua2.so
          test -s magic-phone/android/voice-sip-agent/sip-pjsua2/src/generated/java/org/pjsip/pjsua2/Endpoint.java

      - name: Restore persistent debug signing key for update compatibility
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: magic-phone-android-debug-signing-v1

      - name: Initialize debug signing key once when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Verified stable debug signing keystore is available."

      - name: Run Android tests and assemble APK (retry transient Maven failures only)
        shell: bash
        run: |
          set -euo pipefail
          cd magic-phone/android/voice-sip-agent
          LOG="$RUNNER_TEMP/magic-phone-gradle.log"
          for attempt in 1 2 3 4 5; do
            echo "Gradle attempt $attempt/5"
            if bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug > "$LOG" 2>&1; then
              tail -n 100 "$LOG"
              echo "PASS: unit tests + assembleDebug"
              exit 0
            fi
            tail -n 160 "$LOG"
            if grep -Eq "Could not resolve all artifacts|Could not find org.jetbrains|Could not resolve org.jetbrains|Could not find commons-io|Could not resolve .*classpath" "$LOG" \
              && ! grep -Eq "[0-9]+ tests completed, [1-9][0-9]* failed|:app:testDebugUnitTest FAILED" "$LOG" \
              && [ "$attempt" -lt 5 ]; then
              echo "Transient dependency resolution failure; retrying after delay."
              sleep $((attempt * 15))
              continue
            fi
            exit 1
          done
          exit 1

      - name: Upload Android unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Phone-0.5.7-unit-test-report
          path: |
            magic-phone/android/voice-sip-agent/app/build/reports/tests/testDebugUnitTest/
            magic-phone/android/voice-sip-agent/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK signature, package, version and archive
        shell: bash
        run: |
          set -euo pipefail
          APK="magic-phone/android/voice-sip-agent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -15
          printf '%s\n' "$BADGING" | grep -Fq "name='site.magics.phone.agent'"
          printf '%s\n' "$BADGING" | grep -Fq "versionCode='15'"
          printf '%s\n' "$BADGING" | grep -Fq "versionName='0.5.7-direct'"
          unzip -tq "$APK"
          mkdir -p dist
          cp "$APK" dist/Magic-Phone-0.5.7-direct-arm64-debug.apk
          sha256sum dist/Magic-Phone-0.5.7-direct-arm64-debug.apk > dist/SHA256SUMS.txt
          printf 'source_repo=avayearam/magics-phone\nsource_sha=0c0ee54c32af1f5191cf51a82c8eb5f4460f103a\nmode=origin-only\nversion=0.5.7-direct\nbackend_sha=1ee9c58bb41641b7dbad58d34a83b45727b4625d\nsigning_profile=stable-debug-v1\n' > dist/BUILD_INFO.txt

      - name: Upload signed debug APK only after passing all checks
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Phone-0.5.7-stable-signing-APK
          path: |
            dist/Magic-Phone-0.5.7-direct-arm64-debug.apk
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
