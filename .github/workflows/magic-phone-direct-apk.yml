name: Build Magic Phone Direct Android APK

on:
  push:
    paths:
      - '.github/workflows/magic-phone-direct-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-direct-debug:
    name: Verify and build direct-only Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact Magic Phone source and pinned upstream
        uses: actions/checkout@v4
        with:
          repository: avayearam/magics-phone
          ref: 461ffb3aff8c8eb30e8cbb667c6e1e9b32eb3004
          path: magic-phone
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm source SHA and submodules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C magic-phone rev-parse HEAD)" = "461ffb3aff8c8eb30e8cbb667c6e1e9b32eb3004"
          git -C magic-phone submodule status
          test -f magic-phone/android/voice-sip-agent/gradlew
          test -f magic-phone/android/voice-sip-agent/sip-pjsua2/native/build-pjsua2.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37.2 and pinned NDK using preinstalled runner tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.2" "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig autoconf automake libtool pkg-config build-essential bison flex perl curl unzip zip

      - name: Verify direct-only endpoint and device token contract
        shell: bash
        run: |
          set -euo pipefail
          bash magic-phone/android/voice-sip-agent-overlay/tests/direct-only-contract.sh

      - name: Apply verified Magic Phone overlay and Vazirmatn fonts
        shell: bash
        run: |
          set -euo pipefail
          bash magic-phone/android/voice-sip-agent-overlay/apply.sh
          grep -Fq 'wss://ai.magics.site/call/ws?mode=phone' magic-phone/android/voice-sip-agent/app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/GeminiLiveEndpoint.kt

      - name: Restore native PJSIP cache from verified pinned upstream revision
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sim-ai-agent/sip-pjsua2/src/generated
          key: sim-agent-pjsip-2.17-openssl3.5.9-opus1.6.1-ndk28.2-arm64-v1

      - name: Install pinned native generated JNI and SWIG sources from cache
        if: steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/sim-ai-agent/sip-pjsua2/src/generated"
          TARGET="$GITHUB_WORKSPACE/magic-phone/android/voice-sip-agent/sip-pjsua2/src/generated"
          test -s "$SOURCE/jniLibs/arm64-v8a/libpjsua2.so"
          test -s "$SOURCE/java/org/pjsip/pjsua2/Endpoint.java"
          mkdir -p "$(dirname "$TARGET")"
          cp -a "$SOURCE" "$TARGET"
          test -s "$TARGET/jniLibs/arm64-v8a/libpjsua2.so"
          test -s "$TARGET/java/org/pjsip/pjsua2/Endpoint.java"
          echo "Native sources restored from pinned upstream SHA 5105a1f447ffa25ba32d0620dbeef44bbc1705ce"

      - name: Build pinned native SIP dependency if cache unavailable
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd magic-phone/android/voice-sip-agent/sip-pjsua2/native
          bash ./build-pjsua2.sh

      - name: Verify native JNI and Java files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s magic-phone/android/voice-sip-agent/sip-pjsua2/src/generated/jniLibs/arm64-v8a/libpjsua2.so
          test -s magic-phone/android/voice-sip-agent/sip-pjsua2/src/generated/java/org/pjsip/pjsua2/Endpoint.java

      - name: Run Android unit tests and assemble APK
        shell: bash
        run: |
          set -euo pipefail
          cd magic-phone/android/voice-sip-agent
          bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK signature, package, version and archive
        shell: bash
        run: |
          set -euo pipefail
          APK="magic-phone/android/voice-sip-agent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -15
          printf '%s\n' "$BADGING" | grep -Fq "name='site.magics.phone.agent'"
          printf '%s\n' "$BADGING" | grep -Fq "versionCode='11'"
          unzip -tq "$APK"
          mkdir -p dist
          cp "$APK" dist/Magic-Phone-0.5.3-direct-arm64-debug.apk
          sha256sum dist/Magic-Phone-0.5.3-direct-arm64-debug.apk > dist/SHA256SUMS.txt
          printf 'source_repo=avayearam/magics-phone\nsource_sha=461ffb3aff8c8eb30e8cbb667c6e1e9b32eb3004\nmode=origin-only\nversion=0.5.3-direct\n' > dist/BUILD_INFO.txt

      - name: Upload signed debug APK only after passing all checks
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Phone-0.5.3-direct-APK
          path: |
            dist/Magic-Phone-0.5.3-direct-arm64-debug.apk
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
