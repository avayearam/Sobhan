name: Build Persian Magic Agent APK
on:
  push:
    branches:
      - build/sim-ai-agent-elevenlabs-20261118
    paths:
      - '.github/workflows/build-sim-ai-agent-elevenlabs.yml'
      - 'experiments/sim-ai-agent-elevenlabs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout isolated build scripts
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK API 37.2 from preinstalled runner tools
        shell: bash
        run: |
          set -euo pipefail
          echo "SDK root: ${ANDROID_HOME:-not-set}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.2" "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Checkout pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/sparkcyf/android-voice-sip-agent.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --detach 5105a1f447ffa25ba32d0620dbeef44bbc1705ce
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 5105a1f447ffa25ba32d0620dbeef44bbc1705ce
      - name: Apply isolated ElevenLabs patch
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/sim-ai-agent-elevenlabs/apply_patch.py "$RUNNER_TEMP/upstream" --output "$RUNNER_TEMP/sim-ai-agent"
      - name: Apply Persian RTL Magic Agent branding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/sim-ai-agent-elevenlabs/localize_magic_agent.py
          python3 experiments/sim-ai-agent-elevenlabs/localize_magic_agent.py "$RUNNER_TEMP/sim-ai-agent"
          mkdir -p "$RUNNER_TEMP/sim-ai-agent/app/src/main/res/font"
          curl -fLsS --retry 3 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' -o "$RUNNER_TEMP/sim-ai-agent/app/src/main/res/font/vazirmatn.ttf"
          test -s "$RUNNER_TEMP/sim-ai-agent/app/src/main/res/font/vazirmatn.ttf"
          file "$RUNNER_TEMP/sim-ai-agent/app/src/main/res/font/vazirmatn.ttf"
          mkdir -p "$RUNNER_TEMP/sim-ai-agent/app/src/main/assets"
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/OFL.txt' -o "$RUNNER_TEMP/sim-ai-agent/app/src/main/assets/OFL-VAZIRMATN.txt"
          test -s "$RUNNER_TEMP/sim-ai-agent/app/src/main/assets/OFL-VAZIRMATN.txt"
      - name: Apply safe ElevenLabs defaults and credentials-first setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile experiments/sim-ai-agent-elevenlabs/preset_elevenlabs.py
          python3 experiments/sim-ai-agent-elevenlabs/preset_elevenlabs.py "$RUNNER_TEMP/sim-ai-agent"
      - name: Check Persian UI and safe defaults
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim-ai-agent"
          grep -q 'مجیک ایجنت' app/src/main/res/values/strings.xml
          grep -q 'LayoutDirection.Rtl' app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/MagicTheme.kt
          grep -q 'val audioMethod: Int = AudioMethod.LEGACY' app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/SettingsStore.kt
          grep -q 'val takeover: Boolean = false' app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/SettingsStore.kt
          grep -q 'val directSipMode: Boolean = true' app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/SettingsStore.kt
          grep -q 'sip.rtc.elevenlabs.io' app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/SettingsStore.kt
          grep -q 'اعمال تنظیمات آماده ElevenLabs' app/src/main/kotlin/io/github/sparkcyf/voicesipagent/app/MainActivity.kt
      - name: Restore native PJSIP cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sim-ai-agent/sip-pjsua2/src/generated
          key: sim-agent-pjsip-2.17-openssl3.5.9-opus1.6.1-ndk28.2-arm64-v1
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig autoconf automake libtool make g++ patch perl
      - name: Build PJSIP native Java bindings and arm64 JNI
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim-ai-agent"
          ABIS=arm64-v8a bash sip-pjsua2/native/build-pjsua2.sh
          test -s sip-pjsua2/src/generated/jniLibs/arm64-v8a/libpjsua2.so
          test -s sip-pjsua2/src/generated/java/org/pjsip/pjsua2/Endpoint.java
      - name: Cache native PJSIP generated bindings
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sim-ai-agent/sip-pjsua2/src/generated
          key: sim-agent-pjsip-2.17-openssl3.5.9-opus1.6.1-ndk28.2-arm64-v1
      - name: Compile Persian Magic Agent debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim-ai-agent"
          chmod +x gradlew
          # The upstream UDP socket-release test can intermittently race Linux port reuse.
          # Never ignore a persistent failure: a second independent full SIP test run must pass.
          for attempt in 1 2; do
            if ./gradlew --no-daemon --stacktrace --max-workers=1 :sip:test; then
              echo "SIP suite passed on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "SIP suite failed twice. Stopping build."
              exit 1
            fi
            echo "SIP socket test failed. Retrying full suite once after cooldown."
            sleep 5
          done
          ./gradlew --no-daemon --stacktrace --max-workers=1 :gateway:test :app:testDebugUnitTest :app:assembleDebug
      - name: Check built artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/sim-ai-agent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Magic-Agent-FA-v0.5.1-debug.apk"
      - name: Upload actual APK
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Agent-FA-v0.5.1-debug
          path: Magic-Agent-FA-v0.5.1-debug.apk
          if-no-files-found: error
          retention-days: 7
