name: Build SIM AI Agent ElevenLabs
on:
  push:
    branches:
      - build/sim-ai-agent-elevenlabs-20261118
    paths:
      - '.github/workflows/build-sim-ai-agent-elevenlabs.yml'
      - 'experiments/sim-ai-agent-elevenlabs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated build scripts
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK API 37
        run: |
          sdkmanager --install "platforms;android-37" "platform-tools" "build-tools;36.0.0"
      - name: Checkout pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/sparkcyf/android-voice-sip-agent.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout --detach 5105a1f447ffa25ba32d0620dbeef44bbc1705ce
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 5105a1f447ffa25ba32d0620dbeef44bbc1705ce
      - name: Apply isolated ElevenLabs patch
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/sim-ai-agent-elevenlabs/apply_patch.py "$RUNNER_TEMP/upstream" --output "$RUNNER_TEMP/sim-ai-agent"
      - name: Build signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim-ai-agent"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Check built artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/sim-ai-agent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/SIM-AI-Agent-ElevenLabs-direct-alpha1-debug.apk"
      - name: Upload actual APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-AI-Agent-ElevenLabs-direct-alpha1-debug
          path: SIM-AI-Agent-ElevenLabs-direct-alpha1-debug.apk
          if-no-files-found: error
          retention-days: 7
